# Construit CrunchCutContour pour Windows, macOS et Linux, et publie une release GitHub
# quand on pousse une étiquette vX.Y.Z (égale à VERSION dans crunchcutcontour.py).
# Lancé à la main (workflow_dispatch), il construit seulement : les fichiers sont dans
# les « artifacts » de l'exécution.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    # Version fixée : ubuntu-latest est passé à Ubuntu 26.04 (oct. 2026), sans Python 3.8.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"   # la plus ancienne version embarquée (Windows 7/8)
      - name: Tests
        run: python -m unittest discover tests

  windows:
    strategy:
      matrix:
        cible: [win7, win10]   # Windows 7/8/8.1 32 bits (Python 3.8) ; Windows 10/11 64 bits
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire
        shell: cmd
        run: construire_exe.bat ${{ matrix.cible }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.cible }}
          path: dist/*.exe
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        runner: [macos-15-intel, macos-15]   # Intel x86_64 ; Apple Silicon arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Construire
        run: PYTHON=python sh construire.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 : l'exécutable tourne sur les distributions de 2022 et après
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Construire
        run: PYTHON=python sh construire.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier que l'étiquette correspond à la version du programme
        run: |
          VERSION=$(python3 -c "import crunchcutcontour; print(crunchcutcontour.VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à VERSION = $VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # {{VERSION}} des notes remplacé par le numéro de version (v1.2.3 -> 1.2.3)
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" NOTES_DE_VERSION.md > notes.md
          titre="CrunchCutContour $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release déjà créée (à la main, ou par une exécution précédente) : on la complète.
            gh release upload "$GITHUB_REF_NAME" artefacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$titre" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" artefacts/* --title "$titre" --notes-file notes.md
          fi
